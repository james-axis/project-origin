name: Railway Deploy Monitor

on:
  push:
    branches: [main]

jobs:
  monitor-and-fix:
    name: Watch → Fix → Notify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 5

      - name: Wait for Railway to pick up the push
        run: sleep 25

      # ── Poll Railway until deploy completes ───────────────────────────────────
      - name: Poll Railway deployment
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: f95085d7-4c77-443a-85d8-b0a464db8e4c
          ENVIRONMENT_ID: 546b6800-4ada-4d75-9892-25c6d4e981c2
        run: |
          MAX_ATTEMPTS=40
          ATTEMPT=0
          STATUS=""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll $ATTEMPT/$MAX_ATTEMPTS"

            RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"{ deployments(input: { serviceId: \"'"$SERVICE_ID"'\", environmentId: \"'"$ENVIRONMENT_ID"'\" }, first: 1) { edges { node { id status meta { commitMessage } } } } }"}')

            STATUS=$(echo "$RESPONSE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
edges=d.get('data',{}).get('deployments',{}).get('edges',[])
print(edges[0]['node']['status'] if edges else 'UNKNOWN')
" 2>/dev/null || echo "UNKNOWN")

            DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
edges=d.get('data',{}).get('deployments',{}).get('edges',[])
print(edges[0]['node']['id'] if edges else '')
" 2>/dev/null || echo "")

            COMMIT_MSG=$(echo "$RESPONSE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
edges=d.get('data',{}).get('deployments',{}).get('edges',[])
m=(edges[0]['node'].get('meta') or {}) if edges else {}
print((m.get('commitMessage') or '')[:80])
" 2>/dev/null || echo "")

            echo "Status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "result=success" >> $GITHUB_OUTPUT
              echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
              echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              LOGS=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"query":"{ deploymentLogs(deploymentId: \"'"$DEPLOY_ID"'\", limit: 80) { message severity } }"}' \
                | python3 -c "
import sys,json
d=json.load(sys.stdin)
logs=d.get('data',{}).get('deploymentLogs',[])
print('\n'.join([l.get('message','') for l in logs if l.get('message','').strip()])[-3000:])
" 2>/dev/null || echo "Could not fetch logs")

              echo "result=failed" >> $GITHUB_OUTPUT
              echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
              echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
              {
                echo "error_logs<<LOGSEOF"
                echo "$LOGS"
                echo "LOGSEOF"
              } >> $GITHUB_OUTPUT
              break
            else
              echo "Building ($STATUS)... waiting 15s"
              sleep 15
            fi
          done

          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ] && [ "$STATUS" != "SUCCESS" ] && [ "$STATUS" != "FAILED" ] && [ "$STATUS" != "CRASHED" ]; then
            echo "result=timeout" >> $GITHUB_OUTPUT
          fi

      # ── Success → Slack ───────────────────────────────────────────────────────
      - name: Notify Slack — deployed ✅
        if: steps.railway.outputs.result == 'success'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          MSG="${{ steps.railway.outputs.commit_msg }}"
          TIMESTAMP=$(date -u "+%d %b %Y %H:%M UTC")
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ *Project Origin deployed* \`$SHORT_SHA\` — $MSG\\n$TIMESTAMP — https://project-origin-production.up.railway.app\"}"

      # ── Failure → auto-fix via Anthropic API ──────────────────────────────────
      - name: Auto-fix build failure
        if: steps.railway.outputs.result == 'failed' || steps.railway.outputs.result == 'timeout'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ERROR_LOGS: ${{ steps.railway.outputs.error_logs }}
          COMMIT_MSG: ${{ steps.railway.outputs.commit_msg }}
        run: |
          echo "Build failed on: $COMMIT_MSG"
          echo "Calling Anthropic to diagnose and fix..."

          # Gather relevant source files
          SRC_CONTEXT=""
          for f in $(find src -name "*.tsx" -o -name "*.ts" | grep -v ".d.ts" | head -25); do
            SRC_CONTEXT="$SRC_CONTEXT\n=== $f ===\n$(head -150 $f)\n"
          done

          # Write inputs to temp files (avoids shell escaping issues)
          echo "$ERROR_LOGS" > /tmp/error_logs.txt
          printf "%b" "$SRC_CONTEXT" > /tmp/src_context.txt

          python3 << 'PYEOF'
import os, json, urllib.request, sys

api_key = os.environ["ANTHROPIC_API_KEY"]

with open("/tmp/error_logs.txt") as f:
    error_logs = f.read()[:3000]

with open("/tmp/src_context.txt") as f:
    src_context = f.read()[:8000]

prompt = f"""You are an expert TypeScript/React/Vite developer. A Railway production build just failed.

BUILD ERROR LOGS:
{error_logs}

SOURCE FILES (excerpts):
{src_context}

Diagnose the exact TypeScript or build errors shown in the logs and provide file patches to fix them.

Respond ONLY with valid JSON in this exact structure — no markdown fences, no preamble:
{{
  "analysis": "one-sentence root cause",
  "fixes": [
    {{
      "file": "src/pages/example.tsx",
      "find": "exact_string_to_find",
      "replace": "exact_string_to_replace_with"
    }}
  ]
}}

Rules:
- Only address errors that appear in the build logs
- find must be unique within the file and match exactly
- Typical errors: wrong import names, implicit any, missing type annotations, bad JSX syntax
"""

req = urllib.request.Request(
    "https://api.anthropic.com/v1/messages",
    data=json.dumps({
        "model": "claude-sonnet-4-6",
        "max_tokens": 2000,
        "messages": [{"role": "user", "content": prompt}]
    }).encode(),
    headers={
        "Content-Type": "application/json",
        "x-api-key": api_key,
        "anthropic-version": "2023-06-01"
    },
    method="POST"
)

try:
    with urllib.request.urlopen(req, timeout=90) as resp:
        data = json.load(resp)
        text = data["content"][0]["text"].strip()
        # Strip any accidental markdown fences
        if text.startswith("```"):
            text = text.split("```")[1]
            if text.startswith("json"):
                text = text[4:]
            text = text.strip()
        with open("/tmp/fix.json", "w") as f:
            f.write(text)
        print(f"Got fix response: {text[:200]}")
except Exception as e:
    print(f"API error: {e}")
    with open("/tmp/fix.json", "w") as f:
        json.dump({"analysis": f"API error: {e}", "fixes": []}, f)
PYEOF

          # Apply the fixes
          python3 << 'PYEOF2'
import json, sys, os

with open("/tmp/fix.json") as f:
    data = json.load(f)

analysis = data.get("analysis", "unknown error")
fixes = data.get("fixes", [])

print(f"Root cause: {analysis}")
print(f"Fixes to apply: {len(fixes)}")

applied = 0
for fix in fixes:
    filepath = fix.get("file", "")
    find_str = fix.get("find", "")
    replace_str = fix.get("replace", "")
    if not filepath or not find_str:
        continue
    if not os.path.exists(filepath):
        print(f"  SKIP (not found): {filepath}")
        continue
    with open(filepath, "r") as f:
        content = f.read()
    if find_str not in content:
        print(f"  SKIP (pattern not in file): {filepath}")
        print(f"    Looking for: {repr(find_str[:80])}")
        continue
    new_content = content.replace(find_str, replace_str, 1)
    with open(filepath, "w") as f:
        f.write(new_content)
    print(f"  APPLIED: {filepath}")
    applied += 1

print(f"Total applied: {applied}/{len(fixes)}")
if applied == 0:
    print("No fixes could be applied automatically.")
    sys.exit(1)

# Save analysis for commit message
with open("/tmp/analysis.txt", "w") as f:
    f.write(analysis)
PYEOF2

          # Commit and push the fix — Railway will auto-redeploy
          git config user.email "ci@axiscrm.com"
          git config user.name "Axis CI Bot"

          ANALYSIS=$(cat /tmp/analysis.txt 2>/dev/null || echo "build fix")
          ANALYSIS="${ANALYSIS:0:72}"

          git add -A
          git commit -m "fix(ci): $ANALYSIS"
          git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" main
          echo "Fix pushed — Railway is now redeploying."
